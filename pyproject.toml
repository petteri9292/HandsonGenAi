[project]
name = "handsongenai"
version = "0.1.0"
description = "Hands-On Generative AI notebook examples and projects"
readme = "README.md"
requires-python = ">=3.10.19,<3.11"
dependencies = [
    "accelerate>=1.10,<2",
    "datasets>=3.6,<4",
    "diffusers>=0.35.1,<0.36",
    "genaibook==0.1.1",
    "ipykernel>=6.30,<7",
    "ipython>=8.37,<9",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pillow>=11,<13",
    "requests>=2.32,<3",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchsummary==1.5.1",
    "torchvision==0.21.0",
    "tqdm>=4.67,<5",
    "transformers>=4.56,<4.57",
]

[tool.uv]
package = false

# Match the notebooks' recorded PyTorch/CUDA versions on Linux and Windows.
# Other platforms use the standard PyPI distributions.
[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchaudio = { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
